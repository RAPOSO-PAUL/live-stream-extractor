name: Extract Live Streams

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL da página autorizada do canal"
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run extractor
        env:
          SOURCE_URL: ${{ inputs.url }}
        run: |
          python extractor.py "$SOURCE_URL"

      - name: Show result
        if: always()
        run: |
          echo "================================"
          echo "          RESULTADO"
          echo "================================"

          if [ -f streams.json ]; then
            cat streams.json
          else
            echo "streams.json não foi criado."
          fi

          echo ""
          echo "================================"
          echo "       NETWORK LOG"
          echo "================================"

          if [ -f network.log ]; then
            cat network.log
          fi

      - name: Upload streams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-streams
          path: streams.json
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            page.html
            player.png
            network.log
          if-no-files-found: warn
